<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#184b37" />
      <stop offset="100%" stop-color="#0e3223" />
    </linearGradient>
    <linearGradient id="shieldRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23694f" />
      <stop offset="100%" stop-color="#144330" />
